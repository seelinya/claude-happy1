<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>30 – Birthday Party</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Bebas+Neue&family=Anton&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ══════════════════════════════════
       PAGE – weisser Hintergrund
    ══════════════════════════════════ */
    body {
      min-height: 100vh;
      background: #f5f5f5;
      background-image: radial-gradient(circle, #ccc 1px, transparent 1px);
      background-size: 22px 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      padding: 40px 12px;
    }

    /* ══════════════════════════════════
       KARTE
    ══════════════════════════════════ */
    .card {
      position: relative;
      width: min(500px, 96vw);
      background: #ffffff;
      border: 2.5px solid #111;
      box-shadow: 8px 8px 0 #111, 0 0 60px rgba(124,58,237,.15);
      overflow: hidden;
      padding-bottom: 52px;
    }

    /* ══════════════════════════════════
       DISCO-LICHT-STRAHLEN (animiert)
    ══════════════════════════════════ */
    .light-beams {
      position: absolute;
      top: -60px; left: 50%;
      transform: translateX(-50%);
      width: 600px; height: 600px;
      background: conic-gradient(
        from 0deg,
        transparent 0deg, transparent 16deg,
        rgba(168,85,247,.12) 16deg, rgba(168,85,247,.12) 20deg,
        transparent 20deg, transparent 52deg,
        rgba(124,58,237,.10) 52deg, rgba(124,58,237,.10) 56deg,
        transparent 56deg, transparent 88deg,
        rgba(168,85,247,.12) 88deg, rgba(168,85,247,.12) 92deg,
        transparent 92deg, transparent 124deg,
        rgba(109,40,217,.08) 124deg, rgba(109,40,217,.08) 128deg,
        transparent 128deg, transparent 160deg,
        rgba(168,85,247,.12) 160deg, rgba(168,85,247,.12) 164deg,
        transparent 164deg, transparent 196deg,
        rgba(124,58,237,.10) 196deg, rgba(124,58,237,.10) 200deg,
        transparent 200deg, transparent 232deg,
        rgba(168,85,247,.12) 232deg, rgba(168,85,247,.12) 236deg,
        transparent 236deg, transparent 268deg,
        rgba(109,40,217,.08) 268deg, rgba(109,40,217,.08) 272deg,
        transparent 272deg, transparent 304deg,
        rgba(168,85,247,.12) 304deg, rgba(168,85,247,.12) 308deg,
        transparent 308deg, transparent 340deg,
        rgba(124,58,237,.10) 340deg, rgba(124,58,237,.10) 344deg,
        transparent 344deg
      );
      animation: spin-beams 12s linear infinite;
      pointer-events: none;
      z-index: 0;
    }
    @keyframes spin-beams {
      from { transform: translateX(-50%) rotate(0deg); }
      to   { transform: translateX(-50%) rotate(360deg); }
    }

    /* ══════════════════════════════════
       DISCO-BALL CSS
    ══════════════════════════════════ */
    .disco-ball {
      position: relative;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* Basis-Kugel: silber radial */
    .disco-ball::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: 50%;
      background:
        radial-gradient(circle at 38% 32%,
          #fff 0%, #e8e8e8 12%, #b0b0b0 30%,
          #707070 55%, #383838 78%, #1a1a1a 100%);
    }

    /* Spiegel-Kacheln */
    .disco-ball::after {
      content: '';
      position: absolute; inset: 0;
      border-radius: 50%;
      background:
        repeating-linear-gradient(
          0deg,
          transparent 0px, transparent 9px,
          rgba(0,0,0,.35) 9px, rgba(0,0,0,.35) 10px
        ),
        repeating-linear-gradient(
          90deg,
          transparent 0px, transparent 9px,
          rgba(0,0,0,.35) 9px, rgba(0,0,0,.35) 10px
        );
      animation: tile-shift 4s linear infinite;
    }
    @keyframes tile-shift {
      from { background-position: 0 0, 0 0; }
      to   { background-position: 0 40px, 40px 0; }
    }

    /* Glanz-Reflexe */
    .disco-shine {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      overflow: hidden;
    }
    .disco-shine::before {
      content: '';
      position: absolute;
      width: 30%; height: 30%;
      top: 18%; left: 22%;
      background: radial-gradient(circle, rgba(255,255,255,.9) 0%, transparent 70%);
      border-radius: 50%;
      animation: shine-drift 4s ease-in-out infinite alternate;
    }
    .disco-shine::after {
      content: '';
      position: absolute;
      width: 15%; height: 15%;
      top: 45%; left: 58%;
      background: radial-gradient(circle, rgba(200,160,255,.8) 0%, transparent 70%);
      border-radius: 50%;
      animation: shine-drift 5s ease-in-out infinite alternate-reverse;
    }
    @keyframes shine-drift {
      from { transform: translate(0, 0); }
      to   { transform: translate(6px, 8px); }
    }

    /* Positionierung */
    .db-top {
      position: absolute;
      top: -42px; left: 50%;
      transform: translateX(-50%);
      width: 100px; height: 100px;
      z-index: 10;
      box-shadow: 0 8px 40px rgba(0,0,0,.5), 0 0 30px rgba(168,85,247,.4);
    }
    .db-top .disco-shine { width: 100px; height: 100px; }

    /* Schnur für hängenden Ball */
    .db-top-wrap {
      position: relative;
      height: 96px;
      display: flex;
      justify-content: center;
      z-index: 10;
    }
    .ball-string {
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 2px; height: 50px;
      background: linear-gradient(to bottom, #333, #777);
    }

    .db-left {
      position: absolute;
      top: 60px; left: -50px;
      width: 130px; height: 130px;
      z-index: 3;
      box-shadow: 4px 4px 30px rgba(0,0,0,.4);
    }
    .db-left .disco-shine { width: 130px; height: 130px; }

    .db-right {
      position: absolute;
      top: 40px; right: -55px;
      width: 150px; height: 150px;
      z-index: 3;
      box-shadow: -4px 4px 30px rgba(0,0,0,.4);
    }
    .db-right .disco-shine { width: 150px; height: 150px; }

    .db-br {
      position: absolute;
      bottom: 100px; right: -40px;
      width: 90px; height: 90px;
      z-index: 3;
      box-shadow: -2px 2px 20px rgba(0,0,0,.35);
    }
    .db-br .disco-shine { width: 90px; height: 90px; }

    /* ══════════════════════════════════
       GIRLANDE
    ══════════════════════════════════ */
    .garland {
      position: relative;
      z-index: 11;
      height: 56px;
      overflow: visible;
    }
    .garland-svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 56px;
    }

    /* ══════════════════════════════════
       FOTO
    ══════════════════════════════════ */
    .photo-section {
      position: relative;
      z-index: 5;
      display: flex;
      justify-content: center;
      margin-top: 10px;
      padding: 0 20px;
    }

    .photo-frame {
      position: relative;
      width: 270px;
      height: 310px;
    }

    /* Äussere Deko-Border mit violettem Leuchten */
    .photo-frame::before {
      content: '';
      position: absolute;
      inset: -6px;
      border: 2.5px solid #111;
      box-shadow: 4px 4px 0 #7c3aed, 0 0 24px rgba(124,58,237,.35);
      z-index: 1;
      pointer-events: none;
    }

    .photo-frame img,
    .photo-frame .photo-ph {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      filter: grayscale(1) contrast(1.08);
    }

    .photo-ph {
      background: linear-gradient(160deg, #222 0%, #444 50%, #111 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: #888;
      font-size: 15px;
      font-family: 'Playfair Display', serif;
      text-align: center;
      padding: 16px;
    }

    /* Party-Hut über Foto */
    .hat-wrap {
      position: absolute;
      top: -58px;
      left: 50%;
      transform: translateX(-38%) rotate(-10deg);
      font-size: 86px;
      z-index: 8;
      filter: drop-shadow(3px 3px 4px rgba(0,0,0,.3));
    }

    /* ══════════════════════════════════
       "30" ZAHL
    ══════════════════════════════════ */
    .number-wrap {
      position: relative;
      z-index: 6;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: -20px;
      line-height: 1;
    }

    .candle-row {
      position: absolute;
      top: -22px;
      display: flex;
      gap: 80px;
      font-size: 28px;
    }

    .big-30 {
      font-family: 'Anton', sans-serif;
      font-size: clamp(96px, 27vw, 150px);
      letter-spacing: -6px;
      background: linear-gradient(
        135deg,
        #111 0%, #4c1d95 18%, #7c3aed 35%,
        #a855f7 50%, #7c3aed 65%, #4c1d95 80%, #111 100%
      );
      background-size: 250% 100%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 4px 0 #4c1d95) drop-shadow(0 0 20px rgba(124,58,237,.5));
      animation: violet-shimmer 4s linear infinite;
    }
    @keyframes violet-shimmer {
      0%   { background-position: 0% 50%; }
      100% { background-position: 250% 50%; }
    }

    /* ══════════════════════════════════
       RANSOM-NOTE TEXT
    ══════════════════════════════════ */
    .ransom {
      position: relative;
      z-index: 6;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 3px;
      padding: 0 20px;
      margin-top: -6px;
    }

    .ransom .L {
      display: inline-block;
      font-family: 'Bebas Neue', 'Anton', sans-serif;
      font-size: clamp(20px, 5.5vw, 34px);
      font-weight: 900;
      line-height: 1;
      padding: 3px 6px 1px;
      box-shadow: 2px 2px 0 rgba(0,0,0,.4);
    }
    /* Nur Schwarz, Weiß, Violett */
    .L.k  { background:#111;    color:#fff; }
    .L.w  { background:#fff;    color:#111; border: 2px solid #111; }
    .L.v1 { background:#7c3aed; color:#fff; }
    .L.v2 { background:#a855f7; color:#fff; }
    .L.v3 { background:#4c1d95; color:#fff; }
    .L.g  { background:#ddd;    color:#111; }

    .ransom .gap { width: 10px; }

    /* ══════════════════════════════════
       STERNE & SPARKLES
    ══════════════════════════════════ */
    .star {
      position: absolute;
      pointer-events: none;
      color: #7c3aed;
      font-style: normal;
    }
    .star.bk { color: #111; }
    .star.sl { color: #bbb; }

    .sparkle {
      position: absolute;
      pointer-events: none;
      font-size: 18px;
      animation: tw 2.2s ease-in-out infinite;
    }
    @keyframes tw {
      0%,100% { opacity: .1; transform: scale(.7) rotate(0deg); }
      50%      { opacity: 1;  transform: scale(1.3) rotate(20deg); }
    }

    /* ══════════════════════════════════
       TRENNLINIE
    ══════════════════════════════════ */
    .divider {
      position: relative;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 14px 30px 0;
    }
    .divider-line {
      flex: 1;
      height: 1.5px;
      background: linear-gradient(to right, transparent, #7c3aed, transparent);
    }
    .divider-icon { color: #7c3aed; font-size: 18px; }

    /* ══════════════════════════════════
       INFO (Datum / Ort)
    ══════════════════════════════════ */
    .info {
      position: relative;
      z-index: 6;
      text-align: center;
      padding: 12px 24px 0;
    }
    .info-date {
      font-family: 'Playfair Display', serif;
      font-size: clamp(17px, 4vw, 24px);
      font-weight: 700;
      color: #111;
      letter-spacing: 1.5px;
    }
    .info-sep {
      display: inline-block;
      margin: 0 10px;
      color: #7c3aed;
      font-weight: 900;
    }
    .info-location {
      margin-top: 5px;
      font-size: clamp(12px, 2.8vw, 15px);
      font-style: italic;
      color: #555;
      letter-spacing: .4px;
    }
    .info-location::before { content: '✦  '; color: #7c3aed; font-style: normal; }
    .info-location::after  { content: '  ✦'; color: #7c3aed; font-style: normal; }

    /* ══════════════════════════════════
       RESPONSIVE
    ══════════════════════════════════ */
    @media (max-width: 400px) {
      .db-left  { width: 100px; height: 100px; left: -40px; }
      .db-right { width: 115px; height: 115px; right: -44px; }
      .hat-wrap { font-size: 64px; top: -44px; }
    }
  </style>
</head>
<body>

<div class="card">

  <!-- ══ LICHT-STRAHLEN ══ -->
  <div class="light-beams"></div>

  <!-- ══ DISCO-BÄLLE ══ -->
  <div class="disco-ball db-left"><div class="disco-shine"></div></div>
  <div class="disco-ball db-right"><div class="disco-shine"></div></div>
  <div class="disco-ball db-br"><div class="disco-shine"></div></div>

  <!-- ══ GIRLANDE ══ -->
  <div class="garland">
    <svg class="garland-svg" viewBox="0 0 500 56" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Schnur -->
      <path d="M0,8 Q50,38 100,8 Q150,38 200,8 Q250,38 300,8 Q350,38 400,8 Q450,38 500,8"
            stroke="#333" stroke-width="1.8" fill="none"/>

      <!-- Wimpel schwarz/weiß/violett -->
      <!-- Bei jedem Tiefpunkt der Schnur hängt ein Wimpel -->
      <polygon points="44,28 66,8 88,28"  fill="#111"/>
      <polygon points="144,28 166,8 188,28" fill="#7c3aed"/>
      <polygon points="244,28 266,8 288,28" fill="#fff" stroke="#111" stroke-width="1.5"/>
      <polygon points="344,28 366,8 388,28" fill="#4c1d95"/>
      <polygon points="444,28 466,8 488,28" fill="#111"/>

      <!-- kleine Zwischenwimpel -->
      <polygon points="16,18 28,8 40,18"  fill="#a855f7" opacity=".7"/>
      <polygon points="116,18 128,8 140,18" fill="#ddd" opacity=".8"/>
      <polygon points="216,18 228,8 240,18" fill="#7c3aed" opacity=".7"/>
      <polygon points="316,18 328,8 340,18" fill="#111" opacity=".6"/>
      <polygon points="416,18 428,8 440,18" fill="#a855f7" opacity=".7"/>

      <!-- Glitzer-Kreise auf Schnur -->
      <circle cx="100" cy="8"  r="3" fill="#7c3aed"/>
      <circle cx="200" cy="8"  r="3" fill="#111"/>
      <circle cx="300" cy="8"  r="3" fill="#7c3aed"/>
      <circle cx="400" cy="8"  r="3" fill="#111"/>
    </svg>
  </div>

  <!-- ══ HÄNGENDER DISCO-BALL (mittig oben) ══ -->
  <div class="db-top-wrap">
    <div class="ball-string"></div>
    <div class="disco-ball db-top"><div class="disco-shine"></div></div>
  </div>

  <!-- ══ STERNE ══ -->
  <div class="star bk" style="font-size:34px;top:100px;left:22px">★</div>
  <div class="star"    style="font-size:22px;top:148px;left:36px">★</div>
  <div class="star sl" style="font-size:18px;top:80px; left:52px">✦</div>
  <div class="star"    style="font-size:30px;bottom:180px;left:20px">★</div>
  <div class="star bk" style="font-size:20px;bottom:140px;right:90px">★</div>
  <div class="star sl" style="font-size:26px;bottom:110px;left:82px">★</div>
  <div class="star"    style="font-size:16px;top:180px;right:22px">✦</div>

  <!-- Sparkles -->
  <div class="sparkle" style="top:160px;left:72px;color:#7c3aed;animation-delay:.2s">✦</div>
  <div class="sparkle" style="top:190px;right:70px;color:#a855f7;animation-delay:.8s">✦</div>
  <div class="sparkle" style="bottom:155px;left:44px;color:#7c3aed;animation-delay:1.4s">✦</div>
  <div class="sparkle" style="top:108px;left:44px;color:#111;animation-delay:.5s;font-size:14px">✦</div>
  <div class="sparkle" style="bottom:200px;right:20px;color:#7c3aed;animation-delay:1.1s;font-size:14px">✦</div>

  <!-- ══ FOTO ══ -->
  <div class="photo-section">
    <div class="photo-frame">
      <div class="hat-wrap">🎩</div>
      <!-- Bild: speichere dein Foto als photo.jpg im selben Ordner -->
      <img src="photo.jpg" alt="Geburtstagskind" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>
      <div class="photo-ph" style="display:none">
        <svg width="52" height="52" viewBox="0 0 52 52" fill="none"><circle cx="26" cy="19" r="10" stroke="#666" stroke-width="2"/><path d="M6,48 C6,35 46,35 46,48" stroke="#666" stroke-width="2" fill="none"/></svg>
        Foto hier einfügen<br/><span style="font-size:12px;color:#666">(photo.jpg)</span>
      </div>
    </div>
  </div>

  <!-- ══ GROSSE "30" ══ -->
  <div class="number-wrap">
    <div class="candle-row">🕯️🕯️</div>
    <span class="big-30">30</span>
  </div>

  <!-- ══ RANSOM-NOTE ══ -->
  <div class="ransom">
    <span class="L k"  style="transform:rotate(-2deg)">B</span>
    <span class="L w"  style="transform:rotate(3deg);font-size:80%">i</span>
    <span class="L v1" style="transform:rotate(-1deg)">r</span>
    <span class="L g"  style="transform:rotate(2deg)">t</span>
    <span class="L v3" style="transform:rotate(-3deg)">h</span>
    <span class="L k"  style="transform:rotate(1deg)">D</span>
    <span class="L v2" style="transform:rotate(-2deg)">a</span>
    <span class="L w"  style="transform:rotate(3deg)">y</span>
    <span class="gap"></span>
    <span class="L v1" style="transform:rotate(-1deg)">P</span>
    <span class="L k"  style="transform:rotate(2deg);font-size:80%">A</span>
    <span class="L g"  style="transform:rotate(-3deg)">R</span>
    <span class="L v3" style="transform:rotate(1deg)">T</span>
    <span class="L v2" style="transform:rotate(-2deg)">Y</span>
  </div>

  <!-- ══ TRENNLINIE ══ -->
  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-icon">✦</div>
    <div class="divider-line"></div>
  </div>

  <!-- ══ INFO ══ -->
  <div class="info">
    <div class="info-date">
      21. Juni 2026
      <span class="info-sep">|</span>
      19:30 Uhr
    </div>
    <div class="info-location">Musterrestaurant, Musterstadt</div>
  </div>

</div><!-- .card -->
</body>
</html>
